[project]
name = "coworker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Raman Sharma", email = "raman.sharma@netsmartz.com" }
]
dependencies = [
    "anthropic>=2.3.0",
    "apscheduler<4",
    "chromadb>=1.5.9",
    "plyer>=2.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.workspace]
members = [
    "coworker",
]

[project.scripts]
coworker = "coworker:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
